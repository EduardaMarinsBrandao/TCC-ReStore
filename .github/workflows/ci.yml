name: CI - Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
    paths:
      - 'Re-Store/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'Re-Store/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

# Cancela execuções anteriores que ainda estejam rodando na mesma branch quando houver novo push
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: "Validação, Lint & Testes (PHP 8.2)"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 📦 Checar Integridade de Estrutura e Arquivos
        run: |
          echo "Validando existência de arquivos essenciais..."
          test -f "Re-Store/index.php" || { echo "index.php não encontrado"; exit 1; }
          test -f "Re-Store/database.sql" || { echo "database.sql não encontrado"; exit 1; }
          test -d "Re-Store/api" || { echo "Diretório api/ não encontrado"; exit 1; }
          test -d "Re-Store/assets" || { echo "Diretório assets/ não encontrado"; exit 1; }
          test -d "Re-Store/config" || { echo "Diretório config/ não encontrado"; exit 1; }
          echo "Todos os assets e estruturas essenciais estão íntegros!"

      - name: 🐘 Configurar Ambiente PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql, json, mbstring
          coverage: none
          tools: none

      - name: 🔍 Validar Sintaxe PHP em Paralelo
        run: |
          echo "Verificando sintaxe PHP em Re-Store e tests em paralelo..."
          find Re-Store tests -type f -name "*.php" -print0 | xargs -0 -n 1 -P 4 php -l

      - name: 🚀 Executar Suíte de Testes (tests/test_suite.php)
        run: |
          php tests/test_suite.php
